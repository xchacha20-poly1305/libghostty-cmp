name: Set up the build
description: Installs Java and Gradle and, unless the job builds them itself, fetches the native job's outputs.

inputs:
  prebuilt:
    description: >-
      Whether to use the ghostty-prebuilt artifact of the native job instead of building the native outputs,
      which needs zig, tic and the NDK
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 17
    - uses: gradle/actions/setup-gradle@v6
    - name: Download the native outputs
      if: inputs.prebuilt == 'true'
      uses: actions/download-artifact@v8
      with:
        name: ghostty-prebuilt
        path: ${{ runner.temp }}/ghostty-prebuilt
    - name: Use the native outputs
      if: inputs.prebuilt == 'true'
      shell: bash
      run: echo "ORG_GRADLE_PROJECT_GHOSTTY_PREBUILT=$RUNNER_TEMP/ghostty-prebuilt" >> "$GITHUB_ENV"
