name: Set up the build
description: Installs Java, the NDK, zig and Gradle, and restores the zig caches.

inputs:
  zig-version:
    description: zig release to install
    required: true
  ndk:
    description: Whether to install the NDK, which only Android builds need
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 17
    - name: Install the NDK
      if: inputs.ndk == 'true'
      shell: bash
      run: |
        ndk=$(sed -n -E 's/^ndk = "([^"]+)".*/\1/p' gradle/libs.versions.toml)
        if [ -z "$ndk" ]; then
          echo "ndk version not found in gradle/libs.versions.toml" >&2
          exit 1
        fi
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk"
    - uses: mlugg/setup-zig@v2
      with:
        version: ${{ inputs.zig-version }}
    - name: Read the pinned ghostty commit
      id: ghostty
      shell: bash
      run: |
        echo "commit=$(sed -n 's/^GHOSTTY_COMMIT=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
    - name: Cache zig objects and packages
      uses: actions/cache@v6
      with:
        path: |
          build/ghostty/zig-cache
          native/zig-pkg
        key: ghostty-jni-${{ runner.os }}-${{ inputs.zig-version }}-${{ steps.ghostty.outputs.commit }}-${{ hashFiles('patches/ghostty/*.patch', 'native/**/*.zig', 'native/build.zig.zon') }}
        restore-keys: ghostty-jni-${{ runner.os }}-${{ inputs.zig-version }}-
    - uses: gradle/actions/setup-gradle@v6
    - name: Prepare patched ghostty source
      shell: bash
      run: ./gradlew ghosttySource
    - name: Check zig against ghostty
      shell: bash
      env:
        ZIG_VERSION: ${{ inputs.zig-version }}
      run: |
        minimum=$(sed -n -E 's/^[[:space:]]*\.minimum_zig_version = "([^"]+)".*/\1/p' build/ghostty/source/build.zig.zon)
        if [ -z "$minimum" ]; then
          echo "minimum_zig_version not found in build/ghostty/source/build.zig.zon" >&2
          exit 1
        fi
        case "$minimum" in
          *-*)
            echo "ghostty requires the zig development build $minimum; pick a ZIG_VERSION by hand" >&2
            exit 1
            ;;
        esac
        if [ "$(printf '%s\n%s\n' "$minimum" "$ZIG_VERSION" | sort -V | head -1)" != "$minimum" ]; then
          echo "ghostty requires zig $minimum, ZIG_VERSION is $ZIG_VERSION" >&2
          exit 1
        fi
