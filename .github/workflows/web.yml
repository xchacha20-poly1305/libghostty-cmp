name: Documentation and web demos

on:
  push:
    branches: [cmp]
    paths:
      - "demo-web/**"
      - "demo-shared/**"
      - "docs/**"
      - "library/**"
      - "library-compose/**"
      - "library-extras/**"
      - "native/**"
      - "patches/ghostty/**"
      - "buildSrc/**"
      - "gradle/**"
      - "gradle.properties"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "kotlin-js-store/**"
      - ".github/workflows/web.yml"
      - ".github/actions/setup/**"
  pull_request:
    paths:
      - "demo-web/**"
      - "demo-shared/**"
      - "docs/**"
      - "library/**"
      - "library-compose/**"
      - "library-extras/**"
      - "native/**"
      - "patches/ghostty/**"
      - "buildSrc/**"
      - "gradle/**"
      - "gradle.properties"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "kotlin-js-store/**"
      - ".github/workflows/web.yml"
      - ".github/actions/setup/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.17.1

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          prebuilt: "false"
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false
      - name: Read the pinned Ghostty revision
        id: ghostty
        run: echo "commit=$(sed -n 's/^GHOSTTY_COMMIT=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
      - name: Restore Zig objects and pinned source packages
        uses: actions/cache@v6
        with:
          path: |
            build/ghostty/zig-cache
            native/zig-pkg
          key: ghostty-web-${{ env.ZIG_VERSION }}-${{ steps.ghostty.outputs.commit }}-${{ hashFiles('patches/ghostty/*.patch', 'native/**/*.zig', 'native/build.zig.zon', 'buildSrc/src/main/kotlin/GhosttyNativePlugin.kt') }}
          restore-keys: |
            ghostty-web-${{ env.ZIG_VERSION }}-${{ steps.ghostty.outputs.commit }}-
            ghostty-jni-${{ env.ZIG_VERSION }}-${{ steps.ghostty.outputs.commit }}-
      - name: Build both offline demos and Pages
        run: ./gradlew :demo-web:offlineZip :demo-web:preparePages
      - uses: actions/upload-artifact@v7
        with:
          name: web-demo-offline
          path: |
            demo-web/build/distributions/demo-web-js-*.zip
            demo-web/build/distributions/demo-web-wasm-*.zip
          if-no-files-found: error
      - name: Install browser test dependencies
        working-directory: demo-web/browser-tests
        run: npm ci
      - name: Install Playwright browsers
        working-directory: demo-web/browser-tests
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify the documentation and both demos
        working-directory: demo-web/browser-tests
        env:
          GHOSTTY_FIREFOX_HEADED: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a npm test -- pages.spec.js --retries=1
      - name: Upload browser test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: pages-browser-tests
          path: |
            demo-web/browser-tests/playwright-report/
            demo-web/browser-tests/test-results/
            demo-web/build/browser-test-packages/manifest.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/cmp' && github.event_name != 'pull_request'
        with:
          path: demo-web/build/pages

  mirror:
    if: github.ref == 'refs/heads/cmp' && github.event_name != 'pull_request'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages-artifact
      - name: Commit the Pages artifact to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/pages-site"
          branch="$RUNNER_TEMP/pages-branch"
          mkdir -p "$site"
          tar -xf "$RUNNER_TEMP/pages-artifact/artifact.tar" -C "$site"
          if git ls-remote --exit-code origin refs/heads/gh-pages >/dev/null; then
            git fetch --depth=1 origin refs/heads/gh-pages
            git worktree add --detach "$branch" FETCH_HEAD
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
            git worktree add --orphan -b gh-pages "$branch"
          fi
          rsync -a --delete --exclude='/.git' "$site/" "$branch/"
          git -C "$branch" add -A
          if ! git -C "$branch" diff --cached --quiet; then
            git -C "$branch" -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Publish Pages from $GITHUB_SHA"
            git -C "$branch" push origin HEAD:refs/heads/gh-pages
          fi
          echo "Source $GITHUB_SHA matches gh-pages commit $(git -C "$branch" rev-parse HEAD)"

  deploy:
    if: github.ref == 'refs/heads/cmp' && github.event_name != 'pull_request'
    needs: mirror
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify the deployed entrypoints
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import os
          from time import sleep
          from urllib.parse import urljoin
          from urllib.request import urlopen

          base_url = os.environ["PAGES_URL"].rstrip("/") + "/"
          entrypoints = {
              "": b">Quick start</h2>",
              "demo/js/": b'data-kotlin-target="js"',
              "demo/wasm/": b'data-kotlin-target="wasm"',
          }
          for path, marker in entrypoints.items():
              url = urljoin(base_url, path)
              for attempt in range(6):
                  try:
                      with urlopen(url, timeout=10) as response:
                          if marker in response.read():
                              print(f"Verified {url}")
                              break
                  except OSError as error:
                      print(f"{url}: {error}")
                  if attempt < 5:
                      sleep(5)
              else:
                  raise SystemExit(f"Expected Pages entrypoint did not appear at {url}")
          PY
