name: Build

on:
  push:
    branches:
      - cmp
    tags:
      - "v*"
    paths-ignore:
      - "demo-web/**"
      - ".github/workflows/web.yml"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "demo-web/**"
      - ".github/workflows/web.yml"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ZIG_VERSION: 0.17.1

jobs:
  # Builds everything that needs zig, tic or the NDK once; the other jobs build against its export.
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          prebuilt: "false"
      - name: Install the NDK
        run: |
          ndk=$(sed -n -E 's/^ndk = "([^"]+)".*/\1/p' gradle/libs.versions.toml)
          if [ -z "$ndk" ]; then
            echo "ndk version not found in gradle/libs.versions.toml" >&2
            exit 1
          fi
          # sdkmanager may stop reading before yes finishes; only its exit status matters.
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" < <(yes 2>/dev/null)
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          # The bridge build runs with its own cache directory, restored below.
          use-cache: false
      - name: Prepare patched ghostty source
        run: ./gradlew ghosttySource
      - name: Check zig against ghostty
        run: |
          minimum=$(sed -n -E 's/^[[:space:]]*\.minimum_zig_version = "([^"]+)".*/\1/p' build/ghostty/source/build.zig.zon)
          if [ -z "$minimum" ]; then
            echo "minimum_zig_version not found in build/ghostty/source/build.zig.zon" >&2
            exit 1
          fi
          case "$minimum" in
            *-*)
              echo "ghostty requires the zig development build $minimum; pick a ZIG_VERSION by hand" >&2
              exit 1
              ;;
          esac
          if [ "$(printf '%s\n%s\n' "$minimum" "$ZIG_VERSION" | sort -V | head -1)" != "$minimum" ]; then
            echo "ghostty requires zig $minimum, ZIG_VERSION is $ZIG_VERSION" >&2
            exit 1
          fi
      - name: Read the pinned ghostty commit
        id: ghostty
        run: echo "commit=$(sed -n 's/^GHOSTTY_COMMIT=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
      # Restored only from the same ghostty commit, so that stale objects do not pile up across updates.
      - name: Restore zig objects and packages
        id: zig-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            build/ghostty/zig-cache
            native/zig-pkg
          key: ghostty-jni-${{ env.ZIG_VERSION }}-${{ steps.ghostty.outputs.commit }}-${{ hashFiles('patches/ghostty/*.patch', 'native/**/*.zig', 'native/build.zig.zon', 'buildSrc/src/main/kotlin/GhosttyNativePlugin.kt') }}
          restore-keys: ghostty-jni-${{ env.ZIG_VERSION }}-${{ steps.ghostty.outputs.commit }}-
      - name: Build the native outputs
        run: ./gradlew ghosttyPrebuilt
      # A tag's cache is visible to that tag only.
      - name: Save zig objects and packages
        if: github.ref_type != 'tag' && steps.zig-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            build/ghostty/zig-cache
            native/zig-pkg
          key: ${{ steps.zig-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v7
        with:
          name: ghostty-prebuilt
          path: build/ghostty/prebuilt
          if-no-files-found: error
          retention-days: 7

  build:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Use the release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "ORG_GRADLE_PROJECT_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build
        # The Web demo workflow owns its executable distribution.
        run: ./gradlew assemble -x :demo-web:assemble
      - uses: actions/upload-artifact@v7
        with:
          name: libraries
          path: |
            library*/build/outputs/aar/*.aar
            library*/build/libs/*.jar
      - name: Build signed Android demo
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_DEMO_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEMO_KEYSTORE_BASE64 }}
          ANDROID_DEMO_STORE_PASSWORD: ${{ secrets.ANDROID_DEMO_STORE_PASSWORD }}
          ANDROID_DEMO_KEY_ALIAS: ${{ secrets.ANDROID_DEMO_KEY_ALIAS }}
          ANDROID_DEMO_KEY_PASSWORD: ${{ secrets.ANDROID_DEMO_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_DEMO_KEYSTORE_BASE64:?Missing Android demo keystore}"
          : "${ANDROID_DEMO_STORE_PASSWORD:?Missing Android demo store password}"
          : "${ANDROID_DEMO_KEY_ALIAS:?Missing Android demo key alias}"
          : "${ANDROID_DEMO_KEY_PASSWORD:?Missing Android demo key password}"
          export ANDROID_DEMO_KEYSTORE="$RUNNER_TEMP/android-demo-release.keystore"
          trap 'rm -f "$ANDROID_DEMO_KEYSTORE"' EXIT
          umask 077
          printf '%s' "$ANDROID_DEMO_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_DEMO_KEYSTORE"
          ./gradlew :demo-android:packageReleaseApk --no-configuration-cache
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: android-demo-release
          path: demo-android/build/distributions/*.apk
          if-no-files-found: error
      - name: Publish snapshot to Maven Central
        if: github.event_name == 'push' && github.ref == 'refs/heads/cmp'
        run: |
          version=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          case "$version" in
            *-SNAPSHOT) ./gradlew publishToMavenCentral ;;
            *) echo "VERSION_NAME=$version is not a SNAPSHOT, skipping" ;;
          esac
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: F22FA56A

  desktop-test:
    needs: native
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Use the release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "ORG_GRADLE_PROJECT_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Run the desktop tests
        shell: bash
        run: ./gradlew :library:desktopTest :library-extras:desktopTest :demo-desktop:test :demo-shared:desktopTest
      - name: Load the library after R8
        shell: bash
        run: ./gradlew :shrink-check:shrinkCheck
      - name: Build desktop demo uber jar
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: ./gradlew :demo-desktop:packageUberJarForCurrentOS
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: desktop-demo-${{ matrix.os }}
          path: demo-desktop/build/compose/jars/*.jar
          if-no-files-found: error

  android-test:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache AVD
        id: avd-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-36-google_apis_ps16k-x86_64
      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis_ps16k
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-load -camera-back none
          disable-animations: false
          script: echo "snapshot written"
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis_ps16k
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -camera-back none
          disable-animations: true
          script: ./gradlew :library:connectedAndroidDeviceTest :library-extras:connectedAndroidDeviceTest

  web-demo-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build the versioned offline web demo
        shell: bash
        run: ./gradlew :demo-web:offlineZip -PVERSION_NAME="${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v7
        with:
          name: web-demo-release
          path: demo-web/build/distributions/*.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
      - desktop-test
      - android-test
      - web-demo-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "tag $VERSION is not a release version" >&2
            exit 1
          fi
          echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup
      - name: Download desktop demo uber jars
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-demo-*
          path: desktop-demo-jars
          merge-multiple: true
      - name: Download the offline web demo
        uses: actions/download-artifact@v8
        with:
          name: web-demo-release
          path: web-demo-release
      - name: Download the Android demo
        uses: actions/download-artifact@v8
        with:
          name: android-demo-release
          path: android-demo-release
      - name: Publish to Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral -PVERSION_NAME="$VERSION"
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: F22FA56A
      - name: Create GitHub release
        run: |
          prerelease=()
          case "$VERSION" in
            *-*) prerelease=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            library*/build/outputs/aar/*.aar \
            library*/build/libs/*-desktop.jar \
            desktop-demo-jars/*.jar \
            web-demo-release/*.zip \
            android-demo-release/*.apk \
            --title "$GITHUB_REF_NAME" \
            --notes "ghostty commit: $(sed -n 's/^GHOSTTY_COMMIT=//p' gradle.properties)" \
            "${prerelease[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
