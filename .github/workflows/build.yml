name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ZIG_VERSION: 0.16.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          zig-version: ${{ env.ZIG_VERSION }}
      - name: Build
        run: ./gradlew assemble
      - uses: actions/upload-artifact@v7
        with:
          name: libraries
          path: |
            library*/build/outputs/aar/*.aar
            library*/build/libs/*.jar
      - name: Publish snapshot to Maven Central
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          version=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          case "$version" in
            *-SNAPSHOT) ./gradlew publishToMavenCentral ;;
            *) echo "VERSION_NAME=$version is not a SNAPSHOT, skipping" ;;
          esac
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: 0CDBE971

  desktop-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          zig-version: ${{ env.ZIG_VERSION }}
          ndk: "false"
      - name: Run the desktop tests
        shell: bash
        run: ./gradlew :library:desktopTest :library-extras:desktopTest

  android-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          zig-version: ${{ env.ZIG_VERSION }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache AVD
        id: avd-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-36-google_apis_ps16k-x86_64
      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis_ps16k
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-load -camera-back none
          disable-animations: false
          script: echo "snapshot written"
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis_ps16k
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -camera-back none
          disable-animations: true
          script: ./gradlew :library:connectedAndroidDeviceTest :library-extras:connectedAndroidDeviceTest

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
      - desktop-test
      - android-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "tag $VERSION is not a release version" >&2
            exit 1
          fi
          echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup
        with:
          zig-version: ${{ env.ZIG_VERSION }}
      - name: Publish to Maven Central
        run: ./gradlew publishAndReleaseToMavenCentral -PVERSION_NAME="$VERSION"
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: 0CDBE971
      - name: Create GitHub release
        run: |
          prerelease=()
          case "$VERSION" in
            *-*) prerelease=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            library*/build/outputs/aar/*.aar \
            library*/build/libs/*-desktop.jar \
            --title "$GITHUB_REF_NAME" \
            --notes "ghostty commit: $(sed -n 's/^GHOSTTY_COMMIT=//p' gradle.properties)" \
            "${prerelease[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
