<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Ghostty · Terminal demos</title>
<style>
:root{font-family:system-ui,sans-serif;color-scheme:light dark;background:#fafafb;color:#202124}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:32px 20px}
main{width:min(680px,100%)}.eyebrow{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:#687078}
h1{font-size:clamp(30px,6vw,48px);letter-spacing:-.04em;margin:12px 0 16px}p{line-height:1.7;color:#687078}
nav{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:32px}a{display:block;padding:28px;border:1px solid #dfe1e5;border-radius:16px;color:inherit;text-decoration:none;background:#fff}
a:hover{border-color:#3584e4}a:focus-visible{outline:3px solid #3584e4;outline-offset:4px}strong{font-size:23px}a span{display:block;margin-top:10px;line-height:1.6;color:#687078}
@media(prefers-color-scheme:dark){:root{background:#242424;color:#f6f5f4}p,.eyebrow,a span{color:#b6b8bc}a{background:#303030;border-color:#484848}}
@media(max-width:480px){nav{grid-template-columns:1fr}a{padding:24px}}
</style>
</head>
<body>
<main>
<div class="eyebrow">libghostty-cmp</div>
<h1 id="heading">Choose a terminal demo</h1>
<p id="intro">The same Compose Multiplatform terminal, built for two Kotlin browser targets.</p>
<nav aria-label="Terminal demos">
<a href="js/"><strong>Kotlin/JS →</strong><span id="js-description">Kotlin application compiled to JavaScript.</span></a>
<a href="wasm/"><strong>Kotlin/Wasm →</strong><span id="wasm-description">Kotlin application compiled to WebAssembly.</span></a>
</nav>
<p id="note">Both versions use the Ghostty WebAssembly core and Skiko renderer.</p>
</main>
<script>
if (((navigator.languages && navigator.languages[0]) || navigator.language || '').toLowerCase().startsWith('zh')) {
  document.documentElement.lang = 'zh-CN';
  document.title = 'Ghostty · 终端演示';
  document.getElementById('heading').textContent = '选择终端演示版本';
  document.getElementById('intro').textContent = '同一套 Compose Multiplatform 终端，分别构建为两个 Kotlin 浏览器版本。';
  document.getElementById('js-description').textContent = 'Kotlin 应用编译为 JavaScript。';
  document.getElementById('wasm-description').textContent = 'Kotlin 应用编译为 WebAssembly。';
  document.getElementById('note').textContent = '两个版本均使用 Ghostty WebAssembly 内核和 Skiko 渲染。';
}
</script>
</body>
</html>
